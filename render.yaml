# Render Blueprint: deploys backend/server as a free web service.
# Render dashboard → New → Blueprint → pick this GitHub repo.
services:
  - type: web
    name: monsoon-ridge-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend/server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_EMAILS
        sync: false # entered in the dashboard
      - key: ALLOWED_ORIGINS
        value: https://monsoon-ridge.web.app,https://monsoon-ridge.firebaseapp.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false # secret
      - key: BREVO_API_KEY
        sync: false # secret
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Monsoon Ridge
      - key: STAFF_ALERT_EMAILS
        sync: false
      - key: REPLY_TO_EMAIL
        sync: false
      - key: SITE_URL
        value: https://monsoon-ridge.web.app
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # secret: paste the service-account JSON in the dashboard
