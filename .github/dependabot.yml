# GitHub checks the packages every week and opens a pull request when a fix is out
# (security fixes straight away). Free; nothing to install.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend/server
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
